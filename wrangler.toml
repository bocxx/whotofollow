name = "whotofollow"
compatibility_date = "2026-05-01"
# Geen workers.dev-tweeling en geen versie-preview-URLs: alleen het eigen domein.
workers_dev = false
preview_urls = false

# De domeinen whotofollow.online en www.whotofollow.online hangen aan deze Worker via het dashboard
# (Worker, Settings, Domains & Routes), niet hier. Zo blijft een deploy zonder
# "Can't infer zone"-fout.

# Sinds 13 november 2026 serveert deze Worker geen site meer: src/worker.ts
# stuurt elk verzoek met een 301 door naar www.aiblik.nl (besluit Cirsten,
# aiblik/docs/besluiten.md). Kaart: aiblik/docs/features/satellieten-301.md
main = "src/worker.ts"

# Alleen robots.txt, de oude sitemaps en het favicon geven nog 200. Cloudflare
# serveert een bestand uit ./bewaar vóór de Worker draait; voor elk ander pad
# (geen bestand) draait de Worker en volgt de 301. Geen run_worker_first.
# Terugdraaien = main weghalen en directory weer op ./dist met npm run build.
[assets]
directory = "./bewaar"

[observability]
enabled = true
